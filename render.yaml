# Blueprint de Render para el sistema de inventarios.
#
# Uso: en Render, New > Blueprint, seleccionar el repositorio de GitHub y
# Render crea la base de datos y el servicio web con esta configuración.
#
# La variable ALLOWED_ORIGINS se deja sin valor (sync: false) porque depende
# de la URL del frontend, que se conoce después del primer despliegue.

databases:
  - name: inventario-db
    databaseName: inventario
    user: inventario
    plan: free
    region: oregon

services:
  - type: web
    name: inventario-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false
